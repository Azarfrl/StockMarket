
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Market Simulator</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-luxon@1.3.1/dist/chartjs-adapter-luxon.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-chart-financial@0.2.1/dist/chartjs-chart-financial.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 25px;
            background: #11151b;
            color: #d8dee8;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 1150px;
            margin: auto;
        }

        h1 {
            font-size: 26px;
            font-weight: 600;
            color: #e5e9f0;
            margin-bottom: 25px;
        }

        h2 {
            font-size: 18px;
            font-weight: 600;
            color: #e0e5ed;
        }

        .panel {
            background: #191f28;
            border: 1px solid #303946;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 18px;
        }

        input {
            padding: 10px 12px;
            border: 1px solid #3b4655;
            border-radius: 3px;
            background: #111720;
            color: #e0e5ed;
            font-size: 14px;
            width: 190px;
            outline: none;
        }

        input:focus {
            border-color: #648c83;
        }

        button {
            padding: 10px 15px;
            border: 1px solid #465363;
            border-radius: 3px;
            background: #293441;
            color: #dce3eb;
            cursor: pointer;
            font-size: 13px;
            margin: 3px;
        }

        button:hover {
            background: #354354;
        }

        button.active {
            background: #345b50;
            border-color: #527c6e;
            color: #e5f1eb;
        }

        .stock-search {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
        }

        .stock-buttons {
            margin-top: 12px;
        }

        .stock-buttons button {
            background: #222c37;
            border-color: #394654;
        }

        .stock-buttons button:hover {
            background: #344352;
        }

        .chart-container {
            position: relative;
            height: 400px;
            width: 100%;
        }

        .portfolio {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
        }

        .portfolio-item {
            background: #151b23;
            border: 1px solid #303946;
            padding: 16px;
            border-radius: 4px;
        }

        .portfolio-item p {
            color: #929eae;
            font-size: 13px;
            margin: 0 0 12px;
        }

        .portfolio-item h2 {
            font-size: 22px;
            margin: 0;
            color: #e2e8f0;
        }

        .trade {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 7px;
        }

        #status {
            color: #c6a76b;
            font-size: 13px;
            margin-top: 12px;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px;
            }

            .chart-container {
                height: 300px;
            }

            .panel {
                padding: 14px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Stock Market Simulator</h1>

    <div class="panel">
        <h2>Choose a Stock</h2>

        <div class="stock-search">
            <input
                type="text"
                id="stockSymbol"
                value="AAPL"
                placeholder="Enter ticker symbol"
                maxlength="10"
            >

            <button onclick="changeStock()">
                Search Stock
            </button>
        </div>

        <div class="stock-buttons">
            <button onclick="selectStock('AAPL')">AAPL</button>
            <button onclick="selectStock('MSFT')">MSFT</button>
            <button onclick="selectStock('TSLA')">TSLA</button>
            <button onclick="selectStock('NVDA')">NVDA</button>
            <button onclick="selectStock('AMZN')">AMZN</button>
        </div>

        <p id="status"></p>
    </div>

    <div class="panel">
        <h2 id="stockTitle">AAPL Stock Price</h2>

        <div>
            <button id="lineTab" class="active" onclick="showLine()">
                Line
            </button>

            <button id="barTab" onclick="showBar()">
                Bar
            </button>

            <button id="candleTab" onclick="showCandlestick()">
                Candlestick
            </button>
        </div>

        <div class="chart-container">
            <canvas id="stockChart"></canvas>
        </div>
    </div>

    <div class="panel">
        <h2>Portfolio</h2>

        <div class="portfolio">

            <div class="portfolio-item">
                <p>Latest Stock Price</p>
                <h2 id="price">$0.00</h2>
            </div>

            <div class="portfolio-item">
                <p>Available Cash</p>
                <h2 id="cash">$1000.00</h2>
            </div>

            <div class="portfolio-item">
                <p id="sharesLabel">AAPL Shares</p>
                <h2 id="shares">0</h2>
            </div>

            <div class="portfolio-item">
                <p>Total Portfolio Value</p>
                <h2 id="value">$1000.00</h2>
            </div>

        </div>
    </div>

    <div class="panel">
        <h2>Buy and Sell Shares</h2>

        <div class="trade">
            <input
                type="number"
                id="amount"
                min="1"
                step="1"
                value="1"
                placeholder="Number of shares"
            >

            <button onclick="tradeStock('buy')">Buy</button>
            <button onclick="tradeStock('sell')">Sell</button>
        </div>
    </div>

</div>

<script>

    let currentSymbol = "AAPL";
    let chartType = "line";

    let labels = [];
    let prices = [];
    let candles = [];

    let stockChart = null;


    async function changeStock() {
        const symbol = document
            .getElementById("stockSymbol")
            .value.trim()
            .toUpperCase();

        if (!symbol) {
            document.getElementById("status").textContent =
                "Enter a stock ticker.";
            return;
        }

        await updateStock(symbol);
    }


    async function selectStock(symbol) {
        document.getElementById("stockSymbol").value = symbol;
        await updateStock(symbol);
    }


    function setActiveTab(tabId) {
        document.getElementById("lineTab").classList.remove("active");
        document.getElementById("barTab").classList.remove("active");
        document.getElementById("candleTab").classList.remove("active");

        document.getElementById(tabId).classList.add("active");
    }


    function showLine() {
        chartType = "line";
        setActiveTab("lineTab");
        createChart();
    }


    function showBar() {
        chartType = "bar";
        setActiveTab("barTab");
        createChart();
    }


    function showCandlestick() {
        chartType = "candlestick";
        setActiveTab("candleTab");
        createChart();
    }


    function createChart() {
        const ctx = document.getElementById("stockChart");

        if (stockChart) {
            stockChart.destroy();
        }

        if (chartType === "candlestick") {

            const candleData = candles.map(candle => ({
                x: new Date(candle.date + "T00:00:00").getTime(),
                o: candle.open,
                h: candle.high,
                l: candle.low,
                c: candle.close
            }));

            stockChart = new Chart(ctx, {
                type: "candlestick",

                data: {
                    datasets: [{
                        label: currentSymbol + " Stock Price",
                        data: candleData,

                        color: {
                            up: "#61977b",
                            down: "#bd6666",
                            unchanged: "#999999"
                        }
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    parsing: false,
                    animation: false,

                    plugins: {
                        legend: {
                            labels: {
                                color: "#d8dee8"
                            },
                            onClick: () => {}
                        }
                    },

                    scales: {
                        x: {
                            type: "time",

                            time: {
                                unit: "day"
                            },

                            ticks: {
                                color: "#929eae"
                            },

                            grid: {
                                color: "#303946"
                            }
                        },

                        y: {
                            ticks: {
                                color: "#929eae",

                                callback: value => "$" + value
                            },

                            grid: {
                                color: "#303946"
                            }
                        }
                    }
                }
            });

        } else {

            stockChart = new Chart(ctx, {
                type: chartType,

                data: {
                    labels: labels,

                    datasets: [{
                        label: currentSymbol + " Closing Price",
                        data: prices,
                        borderColor: "#739b8b",
                        backgroundColor: chartType === "bar"
                            ? "#739b8b"
                            : "rgba(115, 155, 139, 0.15)",
                        borderWidth: 2,
                        fill: chartType === "line",
                        tension: 0.3
                    }]
                },

                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    plugins: {
                        legend: {
                            labels: {
                                color: "#d8dee8"
                            },
                            onClick: () => {}
                        }
                    },

                    scales: {
                        x: {
                            ticks: {
                                color: "#929eae",
                                maxTicksLimit: 10
                            },
                            grid: {
                                color: "#303946"
                            }
                        },

                        y: {
                            beginAtZero: false,
                            ticks: {
                                color: "#929eae",

                                callback: value => "$" + value
                            },
                            grid: {
                                color: "#303946"
                            }
                        }
                    }
                }
            });
        }
    }


    async function updateStock(symbol = currentSymbol) {
        const status = document.getElementById("status");
        status.textContent = "Loading stock data...";

        try {
            const response = await fetch(
                `/stock-price/?symbol=${encodeURIComponent(symbol)}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(
                    data.error || "Unable to retrieve stock data."
                );
            }

            currentSymbol = symbol;
            labels = data.labels;
            prices = data.prices;
            candles = data.candles;

            document.getElementById("stockSymbol").value = symbol;

            document.getElementById("stockTitle").textContent =
                symbol + " Stock Price";

            document.getElementById("price").textContent =
                "$" + Number(data.price).toFixed(2);

            document.getElementById("cash").textContent =
                "$" + Number(data.cash).toFixed(2);

            document.getElementById("shares").textContent =
                data.shares;

            document.getElementById("sharesLabel").textContent =
                symbol + " Shares";

            document.getElementById("value").textContent =
                "$" + Number(data.value).toFixed(2);

            status.textContent = "";
            createChart();

        } catch (error) {
            status.textContent = error.message;
        }
    }


    async function tradeStock(action) {
        const amount = document.getElementById("amount").value;

        if (!Number.isInteger(Number(amount)) || Number(amount) <= 0) {
            document.getElementById("status").textContent =
                "Enter a positive whole number of shares.";
            return;
        }

        try {
            const response = await fetch(
                `/${action}/?amount=${encodeURIComponent(amount)}&symbol=${encodeURIComponent(currentSymbol)}`
            );

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error || "Trade unsuccessful.");
            }

            await updateStock(currentSymbol);

        } catch (error) {
            document.getElementById("status").textContent =
                error.message;
        }
    }

    document.getElementById("stockSymbol").addEventListener(
        "keydown",
        event => {
            if (event.key === "Enter") {
                changeStock();
            }
        }
    );

    updateStock();

</script>

</body>
</html>
